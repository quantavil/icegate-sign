[project]
name = "icegate-sign"
version = "0.1.0"
description = "Linux-native CLI to sign ICEGATE files (BE/SB/TXT, PDF) with a PKCS#11 USB token"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["python-pkcs11>=0.10.1", "cryptography>=50.0.2", "pyhanko>=0.38.0"]

[project.scripts]
icegate-sign = "icegate_sign.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pikepdf>=10.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icegate_sign"]
